<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Deep dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#24243e;stop-opacity:1" />
    </linearGradient>
    <!-- Gold text gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e642;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f0c040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8941a;stop-opacity:1" />
    </linearGradient>
    <!-- Gold border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e642;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#c8941a;stop-opacity:0.7" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer drop shadow -->
  <circle cx="50" cy="50" r="48" fill="#000" opacity="0.3" transform="translate(1,2)"/>

  <!-- Main circle background -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>

  <!-- Outer gold thin border ring -->
  <circle cx="50" cy="50" r="46.5" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Inner decorative ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(200,148,26,0.25)" stroke-width="0.6"/>

  <!-- Small corner diamond decorations -->
  <polygon points="50,7 52.5,10 50,13 47.5,10" fill="#f0c040" opacity="0.7"/>
  <polygon points="50,87 52.5,90 50,93 47.5,90" fill="#f0c040" opacity="0.7"/>

  <!-- SK Letters with elegant gold glow -->
  <text
    x="50"
    y="65"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="40"
    font-weight="bold"
    font-style="italic"
    fill="url(#goldGrad)"
    text-anchor="middle"
    filter="url(#glow)"
    letter-spacing="1"
  >SK</text>

  <!-- Thin underline accent -->
  <line x1="28" y1="71" x2="72" y2="71" stroke="url(#borderGrad)" stroke-width="0.8" opacity="0.6"/>
</svg>
